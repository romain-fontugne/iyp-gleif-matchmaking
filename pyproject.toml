[project]
name = "iyp-gleif"
version = "0.1.0"
description = "Curated mapping between IYP Organization nodes and GLEIF LEIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "neo4j>=5.0",
    "rapidfuzz>=3.0",
]

[project.scripts]
match-gleif = "match_gleif:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["match_gleif.py"]
